services:
  mysql:
    image: mysql:8.4
    container_name: hometic_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hometic_db
    ports:
      - "3306:3306"
    volumes:
      - hometic_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  hometic_mysql_data:
